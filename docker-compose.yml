version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zorion_postgres
    environment:
      POSTGRES_USER: zorion
      POSTGRES_PASSWORD: zorion123
      POSTGRES_DB: zorion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zorion"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zorion_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: zorion_app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: postgres://zorion:zorion123@postgres:5432/zorion?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TICK_INTERVAL_SEC: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: