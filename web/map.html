<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Карта миров</title>
    <link rel="stylesheet" href="/static/css/map.css">
</head>
<body>
    <div id="header">
        <h1>🗺️ Карта миров</h1>
        <!-- --- ФИЛЬТРЫ (в шапке) --- -->
        <div id="filters-container" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: 20px;">
            <label style="color:#94a3b8; font-size:0.8rem;">
                <input type="checkbox" id="filter-has-planets"> С планетами
            </label>
            <label style="color:#94a3b8; font-size:0.8rem;">
                <input type="checkbox" id="filter-life"> Жизнь
            </label>
            <label style="color:#94a3b8; font-size:0.8rem;">
                <input type="checkbox" id="filter-habitable"> Обитаемые
            </label>
            <label style="color:#94a3b8; font-size:0.8rem;">
                Тип планеты:
                <select id="filter-planet-type" style="background:#1e293b; color:#e0e0e0; border:1px solid #334155; border-radius:4px; padding:2px 6px;">
                    <option value="">Все</option>
                    <option value="землеподобная">Землеподобная</option>
                    <option value="газовый гигант">Газовый гигант</option>
                    <option value="пустынная">Пустынная</option>
                    <option value="ледяная">Ледяная</option>
                    <option value="вулканическая">Вулканическая</option>
                    <option value="океаническая">Океаническая</option>
                </select>
            </label>
            <label style="color:#94a3b8; font-size:0.8rem;">
                Ресурсы:
                <select id="filter-resource" style="background:#1e293b; color:#e0e0e0; border:1px solid #334155; border-radius:4px; padding:2px 6px;">
                    <option value="">Все</option>
                    <option value="минералы">Минералы</option>
                    <option value="энергия">Энергия</option>
                    <option value="органика">Органика</option>
                    <option value="редкие">Редкие</option>
                </select>
            </label>
            <button id="apply-filters" style="background:#334155; border:none; color:#e0e0e0; padding:4px 12px; border-radius:4px; cursor:pointer;">Применить</button>
            <button id="reset-filters" style="background:#334155; border:none; color:#e0e0e0; padding:4px 12px; border-radius:4px; cursor:pointer;">Сбросить</button>
            <span id="filter-status" style="color:#94a3b8; font-size:0.8rem; margin-left:10px;"></span>
        </div>
        <div style="margin-left:auto;">
            <span id="currentWorldLabel" style="margin-right:1rem;color:#94a3b8;">Текущий мир: <strong id="currentWorldName">—</strong></span>
            <button onclick="location.href='/'">🏠 Дашборд</button>
            <button onclick="location.href='/assignments'">📋 Контракты</button>
        </div>
    </div>
    <div id="canvas-wrapper">
        <canvas id="mapCanvas"></canvas>
        <div id="loading">⏳ Загрузка данных...</div>
        <div id="tooltip">
            <h3 id="tooltipName">—</h3>
            <p id="tooltipType">Тип: —</p>
            <p id="tooltipLevel">Уровень: —</p>
            <button id="tooltipFlyBtn">🚀 Лететь</button>
        </div>
        <div id="status-bar">Загрузка...</div>
        <div id="zoom-controls">
            <button id="zoomInBtn" title="Приблизить">➕</button>
            <button id="zoomOutBtn" title="Отдалить">➖</button>
            <button id="centerBtn" title="Найти меня">🎯</button>
            <div id="zoom-info">100%</div>
        </div>
    </div>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
