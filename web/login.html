<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Zorion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f0f4fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1.5rem; width: 100%; max-width: 380px; border: 1px solid #334155; }
        h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        p { color: #94a3b8; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-weight: 500; }
        input { width: 100%; padding: 0.7rem; border-radius: 0.6rem; border: 1px solid #334155; background: #0f172a; color: #f0f4fa; margin-bottom: 1rem; }
        button { width: 100%; padding: 0.8rem; border: none; border-radius: 0.6rem; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .error { color: #f87171; margin-top: 0.5rem; display: none; }
        .link { text-align: center; margin-top: 1rem; color: #94a3b8; }
        .link a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Вход</h1>
        <p>Войдите в свой аккаунт</p>
        <form id="loginForm">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" required>
            <label for="password">Пароль</label>
            <input type="password" id="password" required>
            <div class="error" id="errorMessage"></div>
            <button type="submit">Войти</button>
        </form>
        <div class="link">Нет аккаунта? <a href="/register-page">Зарегистрироваться</a></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorEl.textContent = data.error || 'Неверный логин или пароль';
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', data.token);
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = 'Ошибка сети. Попробуйте позже.';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
